<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EndoVision AI - Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
           background: #050914; color: #f8fafc; font-family: Inter, system-ui, sans-serif; }
    form { width: 100%; max-width: 340px; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 28px; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    .note { font-size: 12px; color: #fbbf24; margin: 0 0 20px; }
    .error { font-size: 12px; color: #fb7185; margin: 0 0 12px; }
    .error:empty { display: none; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 14px; }
    input { display: block; width: 100%; margin-top: 6px; padding: 9px 12px; font-size: 14px; color: #fff;
            background: #020617; border: 1px solid #1e293b; border-radius: 10px; }
    input:focus { outline: none; border-color: #0ea5e9; }
    button { width: 100%; margin-top: 6px; padding: 10px; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer;
             background: linear-gradient(90deg, #0284c7, #0d9488); border: 0; border-radius: 10px; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>EndoVision AI</h1>
    <p class="note">Research demo &ndash; not for clinical use</p>
    <p class="error" role="alert"><!--MESSAGE--></p>
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus />
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
